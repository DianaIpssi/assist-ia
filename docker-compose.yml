services:
  database:
    image: mysql:8.0
    container_name: assist_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: assist_ia
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assist_php
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: dev
      APP_SECRET: ChangeMeInProduction
      DATABASE_URL: mysql://root:root@database:3306/assist_ia?serverVersion=8.0&charset=utf8mb4
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: "llama3.2"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: assist_nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  phpmyadmin:
    image: phpmyadmin:5
    container_name: assist_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      database:
        condition: service_healthy

volumes:
  db_data:
