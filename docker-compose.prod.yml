# Les secrets sont lus dans .env.local (non versionné) :
# docker compose --env-file .env.local -f docker-compose.prod.yml up --build -d
services:
  database:
    image: mysql:8.0
    container_name: assist_db_prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD à définir dans .env.local (lancer avec --env-file .env.local)}
      MYSQL_DATABASE: assist_ia
    volumes:
      - db_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assist_php_prod
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?APP_SECRET à définir dans .env.local (lancer avec --env-file .env.local)}
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@database:3306/assist_ia?serverVersion=8.0&charset=utf8mb4
      MAILER_DSN: ${MAILER_DSN:-null://null}
      OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
      # Adresse fixe : dans un conteneur, 127.0.0.1 (valeur du .env) désigne le conteneur lui-même
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: assist_nginx_prod
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    restart: unless-stopped

volumes:
  db_data_prod:
