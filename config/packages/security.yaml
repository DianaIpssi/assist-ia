security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_agent_provider:
            entity:
                class: App\Entity\Agent
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_agent_provider
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: agent_dashboard
                enable_csrf: true
            logout:
                path: app_logout
                target: app_home

    role_hierarchy:
        ROLE_ADMIN: ROLE_AGENT

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/agent, roles: ROLE_AGENT }
        - { path: ^/property, roles: ROLE_AGENT }
        - { path: ^/api/chat, roles: PUBLIC_ACCESS }
        - { path: ^/api/address, roles: ROLE_AGENT }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
