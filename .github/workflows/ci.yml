name: CI Symfony

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  symfony:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          coverage: none
          extensions: pdo_sqlite, intl

      - name: Validate composer.json
        run: composer validate --no-interaction --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Symfony console check
        run: php bin/console --version
      - name: Lint YAML
        run: php bin/console lint:yaml config --parse-tags
      - name: Lint Twig
        run: php bin/console lint:twig templates
      - name: Lint container
        run: php bin/console lint:container
      - name: Security audit
        run: composer audit --no-interaction
      - name: Prepare test environment
        run: mkdir -p var && php bin/console doctrine:schema:create --env=test --no-interaction
      - name: Run PHPUnit
        run: php bin/phpunit
